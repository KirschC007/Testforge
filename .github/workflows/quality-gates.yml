name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  analyzer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonical release quality gate
        run: pnpm run quality:gate

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v7
        with:
          name: testforge-quality-report
          path: artifacts/quality
