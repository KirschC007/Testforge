name: Deploy TestForge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DIR: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_URL: ${{ secrets.APP_BASE_URL }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: DNS preflight
        run: node --import tsx scripts/verify_dns_ready.ts

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH_CONFIG'
          Host testforge-deploy
            HostName ${{ secrets.HETZNER_HOST }}
            User ${{ secrets.HETZNER_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          SSH_CONFIG
          chmod 600 ~/.ssh/config

      - name: Sync repository
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            --exclude 'artifacts' \
            ./ "testforge-deploy:${APP_DIR}/"

      - name: Deploy on server
        run: |
          ssh testforge-deploy "
            set -e
            cd ${APP_DIR}
            test -f .env
            grep -Eq '^SERVER_NAME=.+$' .env
            grep -Eq '^ACME_EMAIL=.+@.+$' .env
            grep -Eq '^APP_BASE_URL=https://.+' .env
            grep -Eq '^TRUSTED_HOSTS=.+$' .env
            docker network inspect taco_internal >/dev/null
            docker compose -f docker-compose.shared-proxy.yml config >/dev/null
            docker compose -f docker-compose.shared-proxy.yml up -d --build --remove-orphans
            docker compose -f docker-compose.shared-proxy.yml ps
          "

      - name: Smoke test deployment
        run: node --import tsx scripts/smoke_deploy.ts
